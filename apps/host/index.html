<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aegis Host</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background-color: #1a1a1a;
        color: #ffffff;
        padding: 20px;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
      }

      .header h1 {
        font-size: 32px;
        font-weight: 600;
        color: #007AFF;
      }

      .header p {
        font-size: 14px;
        color: #8e8e93;
        margin-top: 5px;
      }

      .app-container {
        background-color: #2c2c2e;
        border-radius: 12px;
        overflow: hidden;
      }

      .app-header {
        background-color: #007AFF;
        padding: 15px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .app-title {
        font-size: 16px;
        font-weight: 600;
      }

      .app-status {
        font-size: 12px;
        color: #ffffff;
        opacity: 0.8;
      }

      #app-renderer {
        min-height: 400px;
        padding: 20px;
      }

      .security-info {
        margin-top: 20px;
        padding: 15px;
        background-color: #3a3a3c;
        border-radius: 8px;
      }

      .security-info h3 {
        font-size: 14px;
        color: #ff9500;
        margin-bottom: 10px;
      }

      .security-info ul {
        list-style: none;
        font-size: 12px;
        color: #8e8e93;
      }

      .security-info li {
        margin-bottom: 5px;
      }

      .security-info li::before {
        content: '✓ ';
        color: #34c759;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Aegis Host</h1>
        <p>安全运行时环境</p>
      </div>

      <div class="app-container">
        <div class="app-header">
          <span class="app-title">应用运行环境</span>
          <span class="app-status">安全模式</span>
        </div>
        <div id="app-renderer"></div>
      </div>

      <div class="security-info">
        <h3>安全特性</h3>
        <ul>
          <li>Worker 执行隔离</li>
          <li>UI Protocol 通信</li>
          <li>Event Protocol 事件处理</li>
          <li>节点隔离验证</li>
        </ul>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
