name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck (source)
        run: pnpm typecheck:all

      - name: Typecheck (tests)
        run: pnpm typecheck:test

      - name: Test
        run: pnpm test

      - name: Test Packager (node env)
        run: pnpm exec vitest run --config packages/packager/vitest.config.ts

      - name: Build
        run: pnpm build
